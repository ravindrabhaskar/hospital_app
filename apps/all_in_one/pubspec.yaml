name: care_companion_all_in_one
description: "CareCompanion All-in-One: a DEMO build that bundles the patient, provider (Pro) and doctor apps behind a role chooser. The stores use the three separate apps."
publish_to: 'none'

# `version: x.y.z+code` -> Android versionName/versionCode.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # The three apps, unchanged, via their public bootstraps (lib/bootstrap.dart).
  care_companion_patient:
    path: ../patient_app
  care_companion_provider:
    path: ../provider_app
  care_companion_doctor:
    path: ../doctor_app
  # Same constraints as the three apps.
  shared_preferences: ^2.5.5
  firebase_core: ^4.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used by the storage-isolation tests (same constraints as the apps).
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/roles/

# App icon + native splash (source and generator script in
# docs/design/brand/all_in_one/). Regenerate with:
#   dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/app_icon_1024.png"
  adaptive_icon_background: "#0B5D45"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 26
  web:
    generate: true
    image_path: "assets/branding/app_icon_1024.png"
    background_color: "#EEF7F2"
    theme_color: "#0B5D45"

flutter_native_splash:
  color: "#EEF7F2"
  image: "assets/branding/splash_logo.png"
  android_12:
    color: "#EEF7F2"
    image: "assets/branding/splash_logo.png"
    icon_background_color: "#EEF7F2"
  web: false
