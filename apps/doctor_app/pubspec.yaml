name: care_companion_doctor
description: "CareCompanion Doctor: the mobile app for doctors (queue, consultations, prescriptions, care plans, messaging)."
publish_to: 'none'

# `version: x.y.z+code` -> Android versionName/versionCode, iOS
# CFBundleShortVersionString/CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  http: ^1.6.0
  http_parser: ^4.1.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1
  intl: ^0.20.3
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  package_info_plus: ^10.2.1
  image_picker: ^1.2.3
  cross_file: ^0.3.5
  record: ^6.1.2
  pdfx: ^2.11.0
  path_provider: ^2.1.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

# App icon + native splash (placeholder brand; source and generator script in
# docs/design/brand/doctor/). Regenerate with:
#   dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/app_icon_1024.png"
  adaptive_icon_background: "#08473A"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  web:
    generate: true
    image_path: "assets/branding/app_icon_1024.png"
    background_color: "#FFFFFF"
    theme_color: "#0B5D45"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/branding/splash_logo.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/branding/splash_logo.png"
  web: false
