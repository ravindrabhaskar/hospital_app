# Build signed Android App Bundles (AAB) for the patient and provider apps,
# optionally upload them to the Google Play INTERNAL track, plus a disabled-by-
# default iOS skeleton. See docs/STORE_SUBMISSION.md for the store side.
#
# REPOSITORY SECRETS (Settings -> Secrets and variables -> Actions -> Secrets)
#   Per app, PREFIX = PATIENT, PROVIDER or DOCTOR (use a different upload key per app):
#     <PREFIX>_ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#                                        (Linux/macOS: base64 -w0 upload.jks ; Windows PowerShell:
#                                         [Convert]::ToBase64String([IO.File]::ReadAllBytes("upload.jks")))
#     <PREFIX>_ANDROID_KEYSTORE_PASSWORD
#     <PREFIX>_ANDROID_KEY_ALIAS
#     <PREFIX>_ANDROID_KEY_PASSWORD
#   Optional:
#     PLAY_SERVICE_ACCOUNT_JSON           Google Play Developer API service account (JSON). If absent,
#                                         the Play upload step is skipped and only artifacts are produced.
#
# REPOSITORY VARIABLES (Settings -> Secrets and variables -> Actions -> Variables)
#     MOBILE_API_BASE_URL                 e.g. https://api.carecompanion.in/api/v1  (--dart-define=API_BASE_URL)
#     MOBILE_DART_DEFINES                 optional shared defines, space separated: "KEY1=v1 KEY2=v2"
#     PATIENT_DART_DEFINES / PROVIDER_DART_DEFINES / DOCTOR_DART_DEFINES   optional per-app defines. The apps read:
#                                         FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_MESSAGING_SENDER_ID
#                                         FIREBASE_PROJECT_ID FIREBASE_IOS_BUNDLE_ID (push) and
#                                         APP_STORE_URL (forced-update link). Values must not contain spaces.
#     IOS_RELEASE_ENABLED                 "true" to run the iOS job (off by default)
#
# Signing: apps/*/android/app/build.gradle.kts reads android/key.properties
# (storePassword, keyPassword, keyAlias, storeFile), which this workflow writes
# from the secrets. If it is missing, Gradle falls back to the DEBUG key, so the
# workflow verifies the bundle signature and fails rather than ship that.
name: Mobile release

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:
    inputs:
      apps:
        description: Which app(s) to build (both = all apps)
        type: choice
        options: [both, patient_app, provider_app, doctor_app]
        default: both
      upload_to_play:
        description: Upload to the Play internal track (needs PLAY_SERVICE_ACCOUNT_JSON)
        type: boolean
        default: false
      release_status:
        description: Play release status (use draft until the app's first review is complete)
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: read

jobs:
  android:
    name: android (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: patient_app
            prefix: PATIENT
            package: com.carecompanion.patient
          - app: provider_app
            prefix: PROVIDER
            package: com.carecompanion.provider
          - app: doctor_app
            prefix: DOCTOR
            package: com.carecompanion.doctor
    env:
      APP_DIR: apps/${{ matrix.app }}
      SELECTED: ${{ github.event_name == 'push' || inputs.apps == 'both' || inputs.apps == matrix.app }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
      # shared defines + per-app defines (e.g. the FIREBASE_APP_ID differs per app)
      EXTRA_DEFINES: ${{ vars.MOBILE_DART_DEFINES }} ${{ vars[format('{0}_DART_DEFINES', matrix.prefix)] }}
    steps:
      - name: Skip (not selected)
        if: env.SELECTED != 'true'
        run: echo "Skipping ${{ matrix.app }}"

      - uses: actions/checkout@v5
        if: env.SELECTED == 'true'

      - name: Preconditions
        if: env.SELECTED == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets[format('{0}_ANDROID_KEYSTORE_BASE64', matrix.prefix)] != '' }}
        run: |
          set -e
          [ -n "$API_BASE_URL" ] || { echo "::error::Repository variable MOBILE_API_BASE_URL is not set"; exit 1; }
          case "$API_BASE_URL" in https://*) ;; *) echo "::error::MOBILE_API_BASE_URL must be https"; exit 1;; esac
          [ "$HAS_KEYSTORE" = "true" ] || { echo "::error::Secret ${{ matrix.prefix }}_ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          if ! grep -q "key.properties" "$APP_DIR/android/app/build.gradle.kts"; then
            echo "::error::$APP_DIR/android/app/build.gradle.kts does not read key.properties; the release build would be DEBUG-signed. See docs/STORE_SUBMISSION.md §3.3."
            exit 1
          fi

      - uses: actions/setup-java@v4
        if: env.SELECTED == 'true'
        with: { distribution: temurin, java-version: "17" }

      - uses: subosito/flutter-action@v2
        if: env.SELECTED == 'true'
        with: { channel: stable, cache: true }

      - name: Decode upload keystore
        if: env.SELECTED == 'true'
        env:
          KEYSTORE_B64: ${{ secrets[format('{0}_ANDROID_KEYSTORE_BASE64', matrix.prefix)] }}
          STORE_PASSWORD: ${{ secrets[format('{0}_ANDROID_KEYSTORE_PASSWORD', matrix.prefix)] }}
          KEY_ALIAS: ${{ secrets[format('{0}_ANDROID_KEY_ALIAS', matrix.prefix)] }}
          KEY_PASSWORD: ${{ secrets[format('{0}_ANDROID_KEY_PASSWORD', matrix.prefix)] }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          umask 077
          cat > "$APP_DIR/android/key.properties" <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF
          sed -i 's/^ *//' "$APP_DIR/android/key.properties"

      - name: Build AAB
        if: env.SELECTED == 'true'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          flutter pub get
          DEFINES="--dart-define=API_BASE_URL=$API_BASE_URL"
          for kv in $EXTRA_DEFINES; do DEFINES="$DEFINES --dart-define=$kv"; done
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/symbols \
            $DEFINES

      - name: Verify the bundle is not debug-signed
        if: env.SELECTED == 'true'
        run: |
          AAB="$APP_DIR/build/app/outputs/bundle/release/app-release.aab"
          ls -l "$AAB"
          if keytool -printcert -jarfile "$AAB" | grep -q "CN=Android Debug"; then
            echo "::error::Bundle is signed with the Android DEBUG key"; exit 1
          fi

      - name: Upload artifacts
        if: env.SELECTED == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.app }}-aab-${{ github.run_number }}
          path: |
            ${{ env.APP_DIR }}/build/app/outputs/bundle/release/app-release.aab
            ${{ env.APP_DIR }}/build/symbols
          retention-days: 30

      - name: Upload to Google Play (internal track)
        if: env.SELECTED == 'true' && env.HAS_PLAY == 'true' && (github.event_name == 'push' || inputs.upload_to_play)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ matrix.package }}
          releaseFiles: ${{ env.APP_DIR }}/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.release_status || 'draft' }}

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" apps/*/android/key.properties

  # ---------------------------------------------------------------------------
  # iOS skeleton - DISABLED unless repository variable IOS_RELEASE_ENABLED=true.
  # Signing notes:
  #   * Needs an Apple Developer Program membership (organisation account, D-U-N-S).
  #   * Create App IDs com.carecompanion.patient / .provider / .doctor, an
  #     "Apple Distribution" certificate and App Store provisioning profiles.
  #   * Secrets: IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD,
  #     IOS_PROVISIONING_PROFILE_<PATIENT|PROVIDER|DOCTOR>_BASE64, APPSTORE_API_KEY_ID,
  #     APPSTORE_API_ISSUER_ID, APPSTORE_API_PRIVATE_KEY (App Store Connect API key, .p8 contents).
  #   * Add ios/ExportOptions.plist (method app-store, teamID, provisioningProfiles).
  #   * Alternative: fastlane match + `fastlane pilot` for TestFlight.
  # ---------------------------------------------------------------------------
  ios:
    if: vars.IOS_RELEASE_ENABLED == 'true'
    name: ios (${{ matrix.app }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: patient_app
            prefix: PATIENT
          - app: provider_app
            prefix: PROVIDER
          - app: doctor_app
            prefix: DOCTOR
    env:
      APP_DIR: apps/${{ matrix.app }}
      API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Install signing certificate and profile
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets[format('IOS_PROVISIONING_PROFILE_{0}_BASE64', matrix.prefix)] }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"; KC_PASS="$(uuidgen)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build IPA
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -f ios/ExportOptions.plist || { echo "::error::Add ios/ExportOptions.plist (see comments above)"; exit 1; }
          flutter pub get
          flutter build ipa --release --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/symbols \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=API_BASE_URL=$API_BASE_URL

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.app }}-ipa-${{ github.run_number }}
          path: ${{ env.APP_DIR }}/build/ios/ipa/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app -t ios -f "$APP_DIR"/build/ios/ipa/*.ipa --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
